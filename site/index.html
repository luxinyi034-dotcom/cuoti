<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>错题本</title>
<meta name="theme-color" content="#F8F2EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="错题本">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Noto+Serif+SC:wght@600&display=swap">
<style>
/* 设计规范：docs/设计规范.md —— 只用这里的变量 */
:root{
  --paper:#F8F2EA; --paper-2:#F1E7DB;
  --ink:#3A2519; --warm:#7A6455; --muted:#A8968A; --line:#E6D8C8;
  --espresso:#4A2B1B; --espresso-ink:#FBF5EE;
  --caramel:#B5733A; --caramel-deep:#7A4A22; --caramel-soft:#F1E0CC; --latte:#D8BC9C;
  --wrong:#B0503A; --wrong-soft:#F5E1D8;
  --right:#6B7A52; --right-soft:#E6E9D9;
  --glass:rgba(255,250,244,.62); --glass-strong:rgba(255,251,247,.86); --glass-edge:rgba(255,255,255,.78);
  --shadow:0 16px 34px -18px rgba(74,43,27,.35),0 2px 6px -2px rgba(74,43,27,.08);
  --r-s:12px; --r-m:18px; --r-l:26px;
  --f-title:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Fraunces",Georgia,"Times New Roman",serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper)}
body{font-family:var(--f-body);color:var(--ink);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(110% 50% at 90% 0%,rgba(255,255,255,.95),transparent 60%),radial-gradient(70% 40% at 0% 34%,#EBD5BC,transparent 70%),radial-gradient(80% 45% at 100% 82%,#E5CDB1,transparent 70%),linear-gradient(180deg,#F8F2EA,#F0E4D5)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
h1,h2,h3,p{margin:0}
img{max-width:100%;display:block}

#app{max-width:560px;margin:0 auto;position:relative}
#view{padding:calc(var(--sat) + 14px) 18px calc(var(--sab) + 112px);display:flex;flex-direction:column;gap:14px;min-height:100vh}
#view>*{flex:none}
.banner{margin:0 -4px;padding:8px 12px;border-radius:var(--r-s);background:var(--caramel-soft);color:var(--caramel-deep);font-size:12.5px;line-height:1.5}

.g{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--glass-edge);border-radius:var(--r-m);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),var(--shadow)}
.g.l{border-radius:var(--r-l)}
.pad{padding:15px}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:16px;height:16px}
.i.xs{width:13px;height:13px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hd-c{font-size:16px;font-weight:600}
.cbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.date{font-size:12.5px;color:var(--warm)}
.hello{font-family:var(--f-title);font-size:28px;font-weight:600;line-height:1.3}
.hello em{font-style:normal;color:var(--caramel)}
.title{font-family:var(--f-title);font-size:26px;font-weight:600;line-height:1.3}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin-top:2px}
.sec b{font-size:15.5px;font-weight:600}
.sec button{font-size:12.5px;color:var(--caramel)}
.muted{color:var(--muted)}
.warm{color:var(--warm)}
.aux{font-size:12px;color:var(--muted)}
.num{font-family:var(--f-num);font-weight:300;letter-spacing:-.01em}
.btn{height:48px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:15px;padding:0 20px;white-space:nowrap}
.btn.sm{height:38px;font-size:13.5px;padding:0 15px}
.btn.p{background:var(--espresso);color:var(--espresso-ink);box-shadow:0 10px 20px -10px rgba(74,43,27,.7)}
.btn.o{background:var(--glass-strong);color:var(--ink);border:1px solid var(--line)}
.btn.t{color:var(--caramel);padding:0 6px;height:40px}
.btn.full{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:3px 12px;border-radius:999px;font-size:13px;background:rgba(255,255,255,.55);border:1px solid var(--line);color:var(--warm);line-height:1.3}
.chip.on{background:var(--espresso);border-color:transparent;color:var(--espresso-ink)}
.chip.c{background:var(--caramel-soft);border-color:transparent;color:var(--caramel-deep)}
.chip.c.on{background:var(--espresso);color:var(--espresso-ink)}
.chip.sm{min-height:24px;font-size:11.5px;padding:2px 9px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.tiles{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:2px 18px 10px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{width:62px;height:68px;border-radius:16px;display:grid;place-content:center;justify-items:center;gap:4px;font-size:12px;color:var(--warm);flex:none}
.tile.on{background:var(--espresso);color:var(--espresso-ink);border-color:transparent;box-shadow:0 10px 18px -10px rgba(74,43,27,.7)}
.seg{display:flex;padding:3px;border-radius:999px;gap:2px}
.seg button{flex:1;text-align:center;font-size:13px;padding:8px 4px;border-radius:999px;color:var(--warm);white-space:nowrap}
.seg button.on{background:#FFFCF8;color:var(--ink);font-weight:500;box-shadow:0 2px 8px -3px rgba(74,43,27,.3)}
.seg .num{font-size:13px}
.dots{display:inline-flex;gap:3px;flex:none}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--espresso)}
.subj{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--warm);min-width:0}
.subj .i{color:var(--ink)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.field{display:grid;gap:6px;min-width:0}
.field>label,.flabel{font-size:13px;color:var(--warm);font-weight:500}
.inp{width:100%;font:inherit;font-size:16px;line-height:1.5;color:var(--ink);border:0;outline:0;border-radius:var(--r-s);background:rgba(241,231,219,.8);padding:11px 13px;resize:none;display:block;-webkit-appearance:none;appearance:none}
textarea.inp{min-height:48px;overflow:hidden}
.inp::placeholder{color:var(--muted)}
.inp:focus{box-shadow:inset 0 0 0 1.5px var(--caramel);background:#FBF6F0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{border-radius:var(--r-s);padding:10px 12px;display:grid;gap:3px;min-width:0}
.ans.w{background:var(--wrong-soft)}
.ans.r{background:var(--right-soft)}
.ans small{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:500}
.ans.w small{color:var(--wrong)}
.ans.r small{color:var(--right)}
.ans p{font-size:16px;white-space:pre-wrap;word-break:break-word}
.ans p.empty{font-size:13px;color:var(--muted)}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .ctr{position:absolute;display:grid;justify-items:center;line-height:1.1}
.text{white-space:pre-wrap;word-break:break-word}

/* 底部导航 / 底部操作条 */
.tabbar{position:fixed;left:max(12px,calc(50% - 268px));right:max(12px,calc(50% - 268px));bottom:calc(var(--sab) + 10px);height:66px;border-radius:24px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:var(--glass-strong);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 #fff,var(--shadow);z-index:20}
.tabbar button{display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);height:100%;align-content:center}
.tabbar button.on{color:var(--espresso);font-weight:600}
.tabbar .plus{width:50px;height:50px;border-radius:50%;background:var(--espresso);color:var(--espresso-ink);display:grid;place-items:center;justify-self:center;align-self:center;box-shadow:0 10px 18px -8px rgba(74,43,27,.75);height:50px}
.bottombar{position:fixed;left:0;right:0;bottom:0;padding:16px max(16px,calc(50% - 264px)) calc(var(--sab) + 14px);display:flex;gap:10px;z-index:20;background:linear-gradient(180deg,rgba(240,228,213,0),rgba(240,228,213,.94) 35%)}
.bottombar>.btn{flex:1}

/* 列表 */
.list{display:grid;gap:10px}
.item{display:grid;gap:7px;padding:13px 15px;text-align:left;width:100%}
.item-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.item-q{font-size:14px;line-height:1.6;word-break:break-word}
.item-b{display:flex;align-items:center;justify-content:space-between;gap:8px}
.item-b .chips{gap:5px}
.when{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);flex:none}
.when.due{color:var(--caramel-deep)}
.when.ok{color:var(--right)}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:var(--paper-2)}
.item-row{display:flex;gap:10px;align-items:flex-start}
.item-row>div{min-width:0;flex:1}

.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:13px 8px}
.qa button{display:grid;justify-items:center;gap:6px;font-size:12px;color:var(--warm)}
.qa .ic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.65);border:1px solid var(--glass-edge);color:var(--ink)}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:64px 1fr 40px;gap:8px;align-items:center;font-size:12.5px}
.bar i{display:block;height:8px;border-radius:999px;background:rgba(74,43,27,.08);position:relative;overflow:hidden}
.bar i b{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--espresso)}
.bar span:last-child{text-align:right;font-family:var(--f-num);color:var(--warm)}
.tl{display:grid;font-size:12.5px}
.tl div{display:grid;grid-template-columns:48px 14px 1fr;align-items:center;gap:8px;min-height:28px}
.tl em{font-style:normal;font-family:var(--f-num);color:var(--muted)}
.tl i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--latte);background:var(--paper);justify-self:center}
.tl i.f{background:var(--espresso);border-color:var(--espresso)}
.prog{height:4px;border-radius:999px;background:rgba(74,43,27,.1);overflow:hidden}
.prog b{display:block;height:100%;background:var(--espresso);border-radius:999px;transition:width .3s}
.photo-box{border-radius:var(--r-m);overflow:hidden;position:relative;background:var(--paper-2)}
.photo-box img{width:100%;max-height:340px;object-fit:contain;background:#efe7dc}
.photo-pick{display:grid;justify-items:center;gap:8px;padding:26px 16px;border-radius:var(--r-m);border:1.5px dashed var(--latte);background:rgba(255,255,255,.4);color:var(--warm);font-size:14px;width:100%}
.photo-pick .ic{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:var(--caramel-soft);color:var(--caramel-deep)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1}
.grade button{display:grid;justify-items:center;gap:2px;padding:10px 4px;border-radius:16px;font-size:15px;font-weight:500}
.grade small{font-size:11px;font-weight:400;color:var(--muted)}
.grade .p{background:var(--espresso);color:var(--espresso-ink);box-shadow:0 10px 20px -10px rgba(74,43,27,.7)}
.grade .p small{color:rgba(251,245,238,.7)}
.grade .bad{color:var(--wrong)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:14px 6px}
.stat3>div{display:grid}
.stat3>div+div{border-left:1px solid var(--line)}
.stat3 .num{font-size:28px}
.ai-tag{font-size:10.5px;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--caramel-soft);color:var(--caramel-deep)}
.ai-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--caramel-soft);color:var(--caramel-deep);flex:none}
.ai-done{background:rgba(241,224,204,.75)}
.prog b.busy{width:40%;background:var(--caramel);animation:busy 1.2s ease-in-out infinite alternate}
@keyframes busy{from{margin-left:0}to{margin-left:60%}}
.ok-line{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--right)}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch i{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.switch.on{background:var(--espresso)}
.switch.on i{left:21px}
.crop-wrap{display:grid;justify-items:center;background:#2f2118;border-radius:var(--r-m);padding:18px 14px}
.crop-stage{position:relative;max-width:100%;overflow:hidden;border-radius:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.crop-stage img{max-width:100%;max-height:56vh;width:auto;height:auto;display:block;pointer-events:none;border-radius:6px}
.crop-box{position:absolute;border:2px solid var(--caramel);border-radius:8px;box-shadow:0 0 0 999px rgba(30,18,10,.5)}
.crop-h{position:absolute;width:30px;height:30px;touch-action:none;cursor:grab}
.crop-h::after{content:"";position:absolute;left:7px;top:7px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--caramel)}
.crop-h.tl{left:-16px;top:-16px}.crop-h.tr{right:-16px;top:-16px}.crop-h.bl{left:-16px;bottom:-16px}.crop-h.br{right:-16px;bottom:-16px}
.empty-card{display:grid;justify-items:center;text-align:center;gap:12px;padding:30px 20px 22px}
.empty-card .ic{width:70px;height:70px;border-radius:22px;display:grid;place-items:center;background:var(--caramel-soft);color:var(--caramel-deep)}
.row-btn{display:flex;align-items:center;gap:12px;padding:13px 2px;width:100%;text-align:left;border-top:1px solid var(--line);font-size:14px}
.row-btn:first-child{border-top:0}
.row-btn .grow{flex:1;min-width:0;display:grid;line-height:1.4}
.danger-text{color:var(--warm);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.armed{background:var(--wrong)!important;color:#fff!important;border-color:transparent!important;text-decoration:none!important}
.danger-text.armed{padding:6px 12px;border-radius:999px}

#toast{position:fixed;left:50%;top:calc(var(--sat) + 12px);transform:translate(-50%,-140%);transition:transform .25s;z-index:50;max-width:min(92vw,440px);padding:11px 16px;border-radius:16px;background:var(--espresso);color:var(--espresso-ink);font-size:14px;box-shadow:var(--shadow)}
#toast.show{transform:translate(-50%,0)}
#toast.warn{background:var(--wrong)}
#viewer{position:fixed;inset:0;z-index:60;background:rgba(30,18,10,.92);display:grid;place-items:center;padding:calc(var(--sat) + 20px) 12px calc(var(--sab) + 20px)}
#viewer img{max-height:100%;object-fit:contain;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(function(){
'use strict';

/* ================= 基本设置 ================= */
var APP_VERSION = 'v3';
var CHANGELOG = [
  { v: 'v3', date: '2026-10-21', items: [

    '数据保护：每天自动备份、改动前自动备份、导出 / 导入备份文件'
  ]}
];
var MODE = window.CUOTI_MODE || 'main';          // main 正式版 | demo 预览 | archive 旧版本预览
var MAIN_DB = 'cuoti-data';                       // 正式数据，永远不改
var DB_NAME = MODE === 'main' ? MAIN_DB : (MODE === 'demo' ? 'cuoti-demo' : 'cuoti-preview');
var LS_KEY = DB_NAME;                             // localStorage 里的第二份（只有文字）
var DAY_START_HOUR = 4;                           // 凌晨 4 点前算前一天

var SUBJECTS = [['math','数学','math'],['phys','物理','phys'],['chem','化学','chem'],['eng','英语','eng'],['chn','语文','chn'],['other','其他','tag']];
var CAUSES = [['concept','概念不清','maze','公式、定义没弄懂'],['read','审题不清','read','漏看条件、看错问题'],['calc','计算失误','calc','思路对，算错了'],['care','粗心','hurry','会做，但看错、写错'],['method','方法不会','target','没思路、不知道从哪下手'],['memory','记忆错误','memo','背过但记错了']];
var SUBJ = {}; SUBJECTS.forEach(function(s){ SUBJ[s[0]] = s; });
var CAUSE = {}; CAUSES.forEach(function(c){ CAUSE[c[0]] = c; });
var FIRST_REVIEW = [[1,'明天'],[3,'3 天后'],[7,'7 天后']];

/* ================= 时间 ================= */
function now(){ return Date.now(); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function keyOf(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dayKey(ts){ return keyOf(new Date(ts - DAY_START_HOUR * 3600e3)); }
function today(){ return dayKey(now()); }
function parseKey(k){ var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(k, n){ var d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); }
function diffDays(a, b){ return Math.round((parseKey(b) - parseKey(a)) / 864e5); }
function mdOf(k){ var d = parseKey(k); return (d.getMonth() + 1) + '/' + d.getDate(); }
function dateCN(k){ var d = parseKey(k); return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日'; }
var WEEK = ['周日','周一','周二','周三','周四','周五','周六'];

/* ================= 存储（IndexedDB：cuoti-data） ================= */
var db = null, mainDb = null;
function idbOpen(name){
  return new Promise(function(res, rej){
    var r = indexedDB.open(name, 1);
    r.onupgradeneeded = function(){ var d = r.result; ['kv','photos','snaps'].forEach(function(s){ if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); }); };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
    r.onblocked = function(){ rej(new Error('blocked')); };
  });
}
function tx(d, store, mode, fn){
  return new Promise(function(res, rej){
    var t; try { t = d.transaction(store, mode); } catch (e) { rej(e); return; }
    var q = fn(t.objectStore(store)), out;
    if (q) q.onsuccess = function(){ out = q.result; };
    t.oncomplete = function(){ res(out); };
    t.onerror = function(){ rej(t.error); };
    t.onabort = function(){ rej(t.error || new Error('abort')); };
  });
}
function iget(store, key, d){ return tx(d || db, store, 'readonly', function(s){ return s.get(key); }); }
function iput(store, key, val){ return tx(db, store, 'readwrite', function(s){ return s.put(val, key); }); }
function idel(store, key){ return tx(db, store, 'readwrite', function(s){ return s.delete(key); }); }
function ilist(store){
  return new Promise(function(res, rej){
    var out = [], t = db.transaction(store, 'readonly'), r = t.objectStore(store).openCursor();
    r.onsuccess = function(){ var c = r.result; if (c) { out.push({ key: c.key, value: c.value }); c.continue(); } };
    t.oncomplete = function(){ res(out); };
    t.onerror = function(){ rej(t.error); };
  });
}

function defaults(){
  return { v: 1, items: [], meta: { created: now(), lastExport: 0, exportSnooze: '', lastVersion: '', lastDailySnap: '', lastSubject: 'math' } };
}
function migrate(s){
  var base = { subject: 'other', q: '', photo: null, my: '', right: '', explain: '', causes: [], note: '', tags: [], source: '', created: now(), due: today(), level: -1, streak: 0, reviews: [] };
  s.items = (s.items || []).map(function(it){ return Object.assign({}, base, it); });
  s.meta = Object.assign(defaults().meta, s.meta || {});
  return s;
}

var S = defaults(), RAW_AT_LOAD = null, saveBlocked = false, notices = [];
async function load(){
  var raw = null;
  try { raw = await iget('kv', 'main'); } catch (e) {}
  if (raw == null) {
    try { raw = localStorage.getItem(LS_KEY); } catch (e) {}
    if (raw) notices.push('从这台手机上的第二份数据里找回了你的错题。');
  }
  RAW_AT_LOAD = raw;
  if (raw) {
    try {
      var r = JSON.parse(raw);
      if (r && r.v === 1 && Array.isArray(r.items)) return migrate(r);
    } catch (e) {}
    // 读不懂：原样另存，绝不覆盖
    var kept = false, stamp = Date.now();
    try { await iput('kv', 'rescue.' + stamp, raw); kept = true; } catch (e) {}
    try { localStorage.setItem(LS_KEY + '.rescue.' + stamp, raw); kept = true; } catch (e) {}
    if (!kept) { saveBlocked = true; notices.push('读不懂这台手机上已有的数据，也没法另存一份。为了不覆盖它，这次不会保存任何改动。'); }
    else notices.push('有一份数据读不懂，已经原样另存，没有删除。');
  }
  return defaults();
}

var saving = Promise.resolve();
function save(){
  saving = saving.then(doSave, doSave);
  return saving;
}
async function doSave(){
  if (saveBlocked) { toast('这次不会保存改动（见首页提示）', true); return false; }
  var str = JSON.stringify(S), ok = false;
  for (var i = 0; i < 30; i++) {
    try { await iput('kv', 'main', str); ok = true; break; }
    catch (e) { if (!(await dropOldestSnap())) break; }
  }
  try { localStorage.setItem(LS_KEY, str); } catch (e) {}
  if (!ok) toast('存储空间不够，刚才的改动没有保存。请到“我的”里导出备份。', true);
  return ok;
}

/* 自动备份 */
async function listSnaps(){
  var all = await ilist('snaps');
  return all.map(function(x){ x.value.key = x.key; return x.value; }).sort(function(a, b){ return b.t - a.t; });
}
async function snapshotRaw(str, reason, kind){
  if (!str) return;
  var all = await listSnaps();
  if (all[0] && all[0].data === str) return;
  var count = 0; try { count = JSON.parse(str).items.length; } catch (e) {}
  for (var i = 0; i < 5; i++) {
    try { await iput('snaps', 'snap-' + now() + '-' + uid(), { t: now(), reason: reason, version: APP_VERSION, kind: kind || 'event', data: str, count: count }); break; }
    catch (e) { if (!(await dropOldestSnap())) break; }
  }
  await pruneSnaps();
}
function snapshot(reason, kind){ return snapshotRaw(JSON.stringify(S), reason, kind); }
async function pruneSnaps(){
  var all = await listSnaps(), keepDaily = 7, keepEvent = 8, d = 0, e = 0;
  for (var i = 0; i < all.length; i++) {
    var s = all[i], keep = i < 2;
    if (s.kind === 'daily') { d++; keep = keep || d <= keepDaily; } else { e++; keep = keep || e <= keepEvent; }
    if (!keep) await idel('snaps', s.key);
  }
}
async function dropOldestSnap(){
  var all = await listSnaps();
  if (all.length <= 2) return false;
  await idel('snaps', all[all.length - 1].key);
  return true;
}

/* 照片 */
var photoUrls = {};
async function getPhoto(id){
  if (!id) return null;
  if (photoUrls[id]) return photoUrls[id];
  var b = null;
  try { b = await iget('photos', id); } catch (e) {}
  if (!b && mainDb) { try { b = await iget('photos', id, mainDb); } catch (e) {} }
  if (!b) return null;
  photoUrls[id] = URL.createObjectURL(b);
  return photoUrls[id];
}
function compressImage(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var max = 1600, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ b ? res(b) : rej(new Error('toBlob')); }, 'image/jpeg', 0.8);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}
function hydratePhotos(root){
  (root || document).querySelectorAll('img[data-photo]').forEach(function(im){
    getPhoto(im.dataset.photo).then(function(u){ if (u) im.src = u; else im.closest('.photo-wrap') && im.closest('.photo-wrap').remove(); });
  });
}

/* ================= 规则：复习安排 ================= */
function uid(){ return now().toString(36) + Math.random().toString(36).slice(2, 7); }
function byId(id){ for (var i = 0; i < S.items.length; i++) if (S.items[i].id === id) return S.items[i]; return null; }
function dueItems(){
  var t = today();
  return S.items.filter(function(it){ return it.due <= t; }).sort(function(a, b){ return a.due < b.due ? -1 : a.due > b.due ? 1 : a.created - b.created; });
}
function reviewsOn(k){
  var out = [];
  S.items.forEach(function(it){ it.reviews.forEach(function(r){ if (dayKey(r.t) === k && !r.p) out.push(r); }); });
  return out;
}
function reviewedTodayCount(){
  var t = today(), n = 0;
  S.items.forEach(function(it){ if (it.reviews.some(function(r){ return !r.p && dayKey(r.t) === t; })) n++; });
  return n;
}
function streakDays(){
  var days = {};
  S.items.forEach(function(it){ it.reviews.forEach(function(r){ if (!r.p) days[dayKey(r.t)] = 1; }); });
  var k = today(), n = 0;
  if (!days[k]) k = addDays(k, -1);
  while (days[k]) { n++; k = addDays(k, -1); }
  return n;
}
var MASTER_STEPS = [7, 15, 30, 60];
function nextGap(it, g){
  if (g === 0) return 1;
  if (g === 1) return 3;
  return MASTER_STEPS[Math.min(it.streak, MASTER_STEPS.length - 1)];
}
function gapLabel(n){ return n === 1 ? '明天' : n + ' 天后'; }
function grade(it, g){
  var gap = nextGap(it, g);
  it.reviews.push({ t: now(), g: g });
  it.streak = g === 2 ? it.streak + 1 : 0;
  it.level = g;
  it.due = addDays(today(), gap);
}
function dueLabel(it){
  if (it.level === 2 && it.due > today()) return ['<svg class="i xs"><use href="#check"/></svg>已掌握', 'ok'];
  var d = diffDays(today(), it.due);
  if (d < 0) return ['<svg class="i xs"><use href="#clock"/></svg>该复习了', 'due'];
  if (d === 0) return ['<svg class="i xs"><use href="#clock"/></svg>今天要复习', 'due'];
  return ['<svg class="i xs"><use href="#clock"/></svg>' + gapLabel(d), ''];
}
function dotsHtml(level){
  var n = level < 0 ? 0 : level + 1;
  return '<span class="dots" aria-label="' + ['还没复习','还不会','有点会','已掌握'][n] + '"><i' + (n > 0 ? ' class="f"' : '') + '></i><i' + (n > 1 ? ' class="f"' : '') + '></i><i' + (n > 2 ? ' class="f"' : '') + '></i></span>';
}

/* ================= 小工具 ================= */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function ic(name, cls){ return '<svg class="i' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#' + name + '"/></svg>'; }
function ring(size, sw, frac, inner, color){
  var r = (size - sw) / 2, c = 2 * Math.PI * r, d = Math.max(0, Math.min(1, frac)) * c;
  return '<div class="ring" style="width:' + size + 'px;height:' + size + 'px"><svg width="' + size + '" height="' + size + '"><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="rgba(74,43,27,.1)" stroke-width="' + sw + '"/>' +
    (d > 0 ? '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + (color || 'var(--espresso)') + '" stroke-width="' + sw + '" stroke-linecap="round" stroke-dasharray="' + d.toFixed(1) + ' ' + c.toFixed(1) + '"/>' : '') +
    '</svg><div class="ctr">' + inner + '</div></div>';
}
var toastTimer;
function toast(msg, warn){
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (warn ? ' warn' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.className = warn ? 'warn' : ''; }, warn ? 5200 : 2600);
}
function firstLine(it){
  var s = (it.q || '').trim();
  return s ? esc(s) : '<span class="muted">（只有照片）</span>';
}

/* ================= 页面 ================= */
var route = { name: 'home' };
var view = document.getElementById('view'), bar = document.getElementById('bar');
var ui = { bookSubject: 'all', bookSeg: 'all', search: '', statsRange: 'week' };

function go(name, params, replace){
  route = Object.assign({ name: name }, params || {});
  try { history[replace ? 'replaceState' : 'pushState']({ r: route }, ''); } catch (e) {}
  render(); window.scrollTo(0, 0);
}
window.addEventListener('popstate', function(e){
  if (e.state && e.state.r) { route = e.state.r; render(); }
});

function render(){
  var r = route.name, html = '', tab = null;
  if (r === 'home') { html = vHome(); tab = 'home'; }
  else if (r === 'book') { html = vBook(); tab = 'book'; }
  else if (r === 'item') html = vItem();
  else if (r === 'add') html = vAdd();
  else if (r === 'crop') html = vCrop();
  else if (r === 'ai') html = vAI();
  else if (r === 'review') html = vReview();
  else if (r === 'done') html = vDone();
  else if (r === 'stats') { html = vStats(); tab = 'stats'; }
  else if (r === 'me') { html = vMe(); tab = 'me'; }
  var top = '';
  if (MODE === 'demo') top = '<div class="banner">这是预览版，里面是示例题目。在这里录的题只存在预览里；正式版开通后请用正式版的地址。</div>';
  if (MODE === 'archive') top = '<div class="banner">这是旧版本 ' + esc(window.CUOTI_ARCHIVE || '') + ' 的预览，用的是你数据的一份副本，在这里改动不会影响真正的记录。<a href="../" style="color:inherit">回到最新版</a></div>';
  notices.forEach(function(n){ top += '<div class="banner">' + esc(n) + '</div>'; });
  var act = document.activeElement, keep = act && act.id && view.contains(act) ? { id: act.id, s: act.selectionStart, e: act.selectionEnd } : null;
  view.innerHTML = top + html;
  bar.innerHTML = tab ? tabbar(tab) : barFor(r);
  hydratePhotos(view);
  view.querySelectorAll('textarea.inp').forEach(autoGrow);
  if (keep) { var el = document.getElementById(keep.id); if (el) { try { el.focus({ preventScroll: true }); if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (e) {} } }
}
function tabbar(on){
  var t = [['home','首页','home'],['book','错题本','book'],null,['stats','统计','chart'],['me','我的','user']];
  return '<nav class="tabbar" aria-label="主导航">' + t.map(function(x){
    if (!x) return '<button class="plus" data-act="add" aria-label="录入错题">' + ic('plus') + '</button>';
    return '<button data-act="tab" data-to="' + x[0] + '"' + (x[0] === on ? ' class="on" aria-current="page"' : '') + '>' + ic(x[2]) + x[1] + '</button>';
  }).join('') + '</nav>';
}

/* ---------- A 首页 / G 第一次打开 ---------- */
function greet(){ var h = new Date(now()).getHours(); return h < 5 ? '夜深了' : h < 11 ? '早上好' : h < 13 ? '中午好' : h < 18 ? '下午好' : '晚上好'; }
function dateLine(){ var d = new Date(now()); return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · ' + WEEK[d.getDay()]; }
function vHome(){
  if (!S.items.length) return vEmpty();
  var due = dueItems(), done = reviewedTodayCount(), total = due.length + done;
  var line2 = due.length ? '今天复习 ' + due.length + ' 题' : (done ? '今天的复习做完了' : '今天没有要复习的题');
  var t = today(), wk = 0, lastWk = 0;
  S.items.forEach(function(it){ var d = diffDays(dayKey(it.created), t); if (d < 7) wk++; else if (d < 14) lastWk++; });
  var mastered = S.items.filter(function(it){ return it.level === 2; }).length;
  var h = '<div class="hd"><span class="date">' + dateLine() + '</span></div>' +
    '<h1 class="hello">' + greet() + '，<br><em>' + line2 + '</em></h1>' +
    exportReminder() +

function vStats(){

  for (var i = 6; i >= 0; i--) { var k = addDays(t, -i), c = S.items.filter(function(it){ return dayKey(it.created) === k; }).length; days.push([k, c]); max = Math.max(max, c); }

      '<div style="display:grid;gap:6px;font-size:13.5px"><span><span class="num" style="font-size:22px">' + mastered + '</span> <span class="muted">/ ' + total + ' 题</span></span>' +

      '<span class="warm">' + rangeName + '新增 <b class="num" style="color:var(--caramel);font-weight:400">' + inRange.length + '</b> 题</span></div>' +
    '</div>' +
    '<div class="g pad" style="display:grid;gap:6px"><div class="hd"><b style="font-size:14px">每天新增</b><span class="aux">最近 7 天共 <span class="num" style="font-size:14px;color:var(--ink)">' + weekTotal + '</span> 题</span></div>' +

        '<path d="' + area + '" fill="url(#ar)"/>' +

        pts.map(function(p, i){ return days[i][1] ? '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.6" fill="#4A2B1B"/>' : ''; }).join('') +

function startAdd(withPhoto){
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(DB_NAME + '.draft') || 'null'); } catch (e) {}
  draft = saved && draftDirty(saved) ? Object.assign(newDraft(), saved) : newDraft();
  if (draft.ai && draft.ai.status === 'busy') draft.ai = null;
  go('add', { resumed: !!(saved && draftDirty(saved)) });
  if (withPhoto) document.getElementById('photoInput').click();
}
function startReview(ids, practice){
  if (!ids.length) { toast('今天没有要复习的题'); return; }
  go('review', { queue: ids, idx: 0, shown: false, practice: !!practice, tally: { g: [0, 0, 0], badIds: [] } });
}
function arm(el){
  if (el.dataset.armed) return true;
  var old = el.innerHTML, oldLabel = el.getAttribute('aria-label');
  el.dataset.armed = '1'; el.classList.add('armed'); el.textContent = el.dataset.confirm || '再点一次确认';
  if (oldLabel) el.setAttribute('aria-label', el.textContent);
  if (el.classList.contains('cbtn')) { el.style.width = 'auto'; el.style.padding = '0 14px'; el.style.borderRadius = '999px'; el.style.fontSize = '13px'; }
  setTimeout(function(){ if (el.isConnected) { delete el.dataset.armed; el.classList.remove('armed'); el.innerHTML = old; el.removeAttribute('style'); if (oldLabel) el.setAttribute('aria-label', oldLabel); } }, 4000);
  return false;
}

function cropToDataUrl(photoId, box){
  return getPhoto(photoId).then(function(u){
    if (!u) throw Object.assign(new Error('照片找不到了'), { kind: 'photo' });
    return new Promise(function(res, rej){
      var img = new Image();
      img.onload = function(){
        var W = img.naturalWidth, H = img.naturalHeight, b = box || { x: 0, y: 0, w: 1, h: 1 };
        var sx = Math.round(b.x * W), sy = Math.round(b.y * H), sw = Math.max(16, Math.round(b.w * W)), sh = Math.max(16, Math.round(b.h * H));
        var k = Math.min(1, 1600 / Math.max(sw, sh)), c = document.createElement('canvas');
        c.width = Math.round(sw * k); c.height = Math.round(sh * k);
        c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = function(){ rej(new Error('照片读不出来')); };
      img.src = u;
    });
  });
}

async function gemini(method, path, body, signal){

    throw Object.assign(new Error(er.message || x.txt.slice(0, 160) || ('HTTP ' + r.status)), { status: r.status, code: er.status || '', reason: reason });
  }

}
function pickGeminiModel(list){
  var ok = list.filter(function(m){ return (m.supportedGenerationMethods || []).indexOf('generateContent') >= 0; }).map(function(m){ return String(m.name).replace(/^models\//, ''); });
  var flash = ok.filter(function(n){ return /^gemini-\d+(\.\d+)?-flash(-preview)?(-[\d-]+)?$/.test(n); });
  var ver = function(n){ return parseFloat(n.match(/^gemini-(\d+(?:\.\d+)?)/)[1]); };
  flash.sort(function(a, b){ return ver(b) - ver(a) || (/preview/.test(a) ? 1 : 0) - (/preview/.test(b) ? 1 : 0) || a.length - b.length; });
  return flash[0] || (ok.indexOf('gemini-flash-latest') >= 0 ? 'gemini-flash-latest' : '');
}
async function findGeminiModel(signal){
  // 不把模型名写死：问 Google 现在有哪些模型，选最新的 Flash（免费额度里有）

var cropDrag = null;
document.addEventListener('pointerdown', function(e){
  var h = e.target.closest && e.target.closest('.crop-h');
  if (!h || route.name !== 'crop') return;
  e.preventDefault();
  cropDrag = { h: h.dataset.h, rect: document.getElementById('cropImg').getBoundingClientRect() };
  try { h.setPointerCapture(e.pointerId); } catch (er) {}
});
document.addEventListener('pointermove', function(e){
  if (!cropDrag) return;
  var r = cropDrag.rect, b = route.box, min = 0.08;
  var px = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), py = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
  var x1 = b.x, y1 = b.y, x2 = b.x + b.w, y2 = b.y + b.h, h = cropDrag.h;
  if (h[1] === 'l') x1 = Math.min(px, x2 - min); else x2 = Math.max(px, x1 + min);
  if (h[0] === 't') y1 = Math.min(py, y2 - min); else y2 = Math.max(py, y1 + min);
  route.box = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
  var el = document.getElementById('cropBox');
  if (el) { el.style.left = x1 * 100 + '%'; el.style.top = y1 * 100 + '%'; el.style.width = (x2 - x1) * 100 + '%'; el.style.height = (y2 - y1) * 100 + '%'; }
});
document.addEventListener('pointerup', function(){ cropDrag = null; });
document.addEventListener('pointercancel', function(){ cropDrag = null; });

/* 导出 / 导入备份文件 */
function blobToDataUrl(b){ return new Promise(function(res){ var r = new FileReader(); r.onload = function(){ res(r.result); }; r.readAsDataURL(b); }); }
async function exportBackup(){
  try {
    var photos = {};
    for (var i = 0; i < S.items.length; i++) {
      var id = S.items[i].photo; if (!id || photos[id]) continue;
      var b = null; try { b = await iget('photos', id); } catch (e) {}
      if (!b && mainDb) { try { b = await iget('photos', id, mainDb); } catch (e) {} }
      if (b) photos[id] = await blobToDataUrl(b);
    }
    var payload = { app: 'cuoti', kind: 'backup', version: APP_VERSION, exportedAt: new Date(now()).toISOString(), data: S, photos: photos };
    var name = '错题本备份-' + today() + '.json';
    var blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
    var file = null; try { file = new File([blob], name, { type: 'application/json' }); } catch (e) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); await markExported(); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 60000);
    await markExported();
  } catch (e) { toast('导出没成功：' + (e && e.message || e), true); }
}
async function markExported(){ S.meta.lastExport = now(); S.meta.exportSnooze = ''; await save(); toast('备份文件导出好了，记得存到网盘或电脑'); render(); }
document.getElementById('importInput').addEventListener('change', async function(e){
  var f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  var p;
  try { p = JSON.parse(await f.text()); } catch (er) { toast('这个文件读不懂，不是错题本的备份', true); return; }
  if (!p || p.app !== 'cuoti' || !p.data || p.data.v !== 1 || !Array.isArray(p.data.items)) { toast('这个文件不是错题本的备份', true); return; }
  await snapshot('导入备份前');
  var ids = Object.keys(p.photos || {});
  for (var i = 0; i < ids.length; i++) {
    try { var b = await (await fetch(p.photos[ids[i]])).blob(); await iput('photos', ids[i], b); } catch (er) {}
  }
  S = migrate(p.data);
  if (await save()) toast('导入好了：' + S.items.length + ' 道题。导入前的数据已自动备份。');
  meInfo.snaps = null; render(); loadMeInfo();
});

async function boot(){
  try { db = await idbOpen(DB_NAME); }
  catch (e) {
    view.innerHTML = '<div class="g pad" style="margin-top:20vh;font-size:15px">这个浏览器不能保存数据（可能开了无痕浏览）。请换成普通模式打开，否则录的题会丢。</div>';
    return;
  }
  if (MODE === 'archive') { try { mainDb = await idbOpen(MAIN_DB); } catch (e) {} }
  if (MODE === 'archive' && mainDb) {
    // 旧版本预览：每次打开都从正式数据复制一份，只改副本
    try { var m = await iget('kv', 'main', mainDb); if (m) await iput('kv', 'main', m); } catch (e) {}
  }
  S = await load();
  await loadAI();
  if (MODE === 'demo' && !S.items.length && !RAW_AT_LOAD) seedDemo();

  if (!saveBlocked) await save();
  if (MODE === 'main') {
    try { if (navigator.storage && navigator.storage.persist && S.items.length) navigator.storage.persist(); } catch (e) {}
    if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
  }
  go('home', null, true);
}
